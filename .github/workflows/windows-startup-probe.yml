name: Validate local startup diagnostic bundle

on:
  workflow_dispatch:
  push:
    branches: [codex/published-startup-015-20260923]
    paths:
      - .github/workflows/windows-startup-probe.yml
      - diagnostics/startup-probe/**

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install and launch exact published compatibility prerelease 0.1.16
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: ./scripts/Test-CandidateInstallSmoke.ps1 -AssetId 583177923
      - name: Execute unchanged local diagnostic bundle and verify its report
        shell: powershell
        run: ./diagnostics/startup-probe/Test-StartupProbe.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-startup-probe-on-server-2022
          path: |
            artifacts/candidate-startup/
            artifacts/startup-probe/
          retention-days: 14
          if-no-files-found: warn
