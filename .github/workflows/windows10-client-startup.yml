name: Compatibility 0.1.16 on actual Windows 10 client
on:
  push:
    branches: [codex/published-startup-015-20260923]
    paths:
      - .github/workflows/windows10-client-startup.yml
      - diagnostics/windows10/**
permissions:
  contents: read
jobs:
  windows10:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare disposable virtualization host
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          # Remove only unused preinstalled SDKs from this disposable hosted runner.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils genisoimage aria2
          df -h /
      - name: Download the exact published compatibility prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inputs artifacts/windows10
          curl --fail --location --retry 2 --silent --show-error --max-time 300 --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/octet-stream' --output inputs/installer.exe https://api.github.com/repos/ikk5515/ScreenTrail-releases/releases/assets/583177923
          echo 'e00b82b8077786483b1c3e7caa4d61dc35cf16f4c418c57a5af0ff06aecad0e8  inputs/installer.exe' | sha256sum -c -
      - name: Start Windows 10 client installation and real app startup
        run: |
          nohup bash -c 'set +e; bash diagnostics/windows10/run-windows10-vm.sh inputs/installer.exe diagnostics/windows10/Test-Windows10Startup.ps1 artifacts/windows10; code=$?; echo "$code" > artifacts/windows10/controller-exit-code.txt; exit "$code"' > artifacts/windows10/controller.log 2>&1 &
          echo "$!" > artifacts/windows10/controller.pid
      - name: Observe first installation progress
        run: |
          for attempt in $(seq 1 60); do
            test ! -f artifacts/windows10/controller-exit-code.txt || break
            sleep 5
          done
          tail -10 artifacts/windows10/controller.log
      - uses: actions/upload-artifact@v4
        with:
          name: windows10-progress-1
          path: artifacts/windows10/
          retention-days: 7
      - name: Observe desktop startup progress
        run: |
          for attempt in $(seq 1 60); do
            test ! -f artifacts/windows10/controller-exit-code.txt || break
            sleep 5
          done
          tail -10 artifacts/windows10/controller.log
      - uses: actions/upload-artifact@v4
        with:
          name: windows10-progress-2
          path: artifacts/windows10/
          retention-days: 7
      - name: Observe client verification progress 3
        run: |
          for attempt in $(seq 1 60); do
            test ! -f artifacts/windows10/controller-exit-code.txt || break
            sleep 5
          done
          tail -10 artifacts/windows10/controller.log
      - uses: actions/upload-artifact@v4
        with:
          name: windows10-progress-3
          path: artifacts/windows10/
          retention-days: 7
      - name: Observe client verification progress 4
        run: |
          for attempt in $(seq 1 60); do
            test ! -f artifacts/windows10/controller-exit-code.txt || break
            sleep 5
          done
          tail -10 artifacts/windows10/controller.log
      - uses: actions/upload-artifact@v4
        with:
          name: windows10-progress-4
          path: artifacts/windows10/
          retention-days: 7
      - name: Observe client verification progress 5
        run: |
          for attempt in $(seq 1 60); do
            test ! -f artifacts/windows10/controller-exit-code.txt || break
            sleep 5
          done
          tail -10 artifacts/windows10/controller.log
      - uses: actions/upload-artifact@v4
        with:
          name: windows10-progress-5
          path: artifacts/windows10/
          retention-days: 7
      - name: Observe client verification progress 6
        run: |
          for attempt in $(seq 1 60); do
            test ! -f artifacts/windows10/controller-exit-code.txt || break
            sleep 5
          done
          tail -10 artifacts/windows10/controller.log
      - uses: actions/upload-artifact@v4
        with:
          name: windows10-progress-6
          path: artifacts/windows10/
          retention-days: 7
      - name: Wait for bounded client verification
        run: |
          # Controller caps ISO acquisition at 20 minutes and the VM at 30 minutes.
          # After the six 5-minute snapshots, allow its own deadline and cleanup to finish.
          for attempt in $(seq 1 300); do
            test ! -f artifacts/windows10/controller-exit-code.txt || break
            sleep 5
          done
          tail -30 artifacts/windows10/controller.log
          test -f artifacts/windows10/controller-exit-code.txt
          exit "$(cat artifacts/windows10/controller-exit-code.txt)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows10-client-startup-results
          path: artifacts/windows10/
          retention-days: 14
          if-no-files-found: warn
